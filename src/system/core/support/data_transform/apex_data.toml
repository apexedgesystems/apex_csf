# apex_data.toml - Component data manifest for DataTransform
#
# Data transformation support component (fullUid=0x00CA00). Applies byte-level
# transforms (masks, overrides) to registered data blocks via ByteMaskProxy.

component = "DataTransform"
namespace = "system_core::support"

[structs]
# Both structs are spec-defined below.
TransformStats = { category = "STATE" }
DataTransformTlm = { category = "TELEMETRY", opcode = "0x0600" }

[enums]
DataTransformOpcode = { header = "inc/DataTransformData.hpp" }

[[fields.DataTransformTlm]]
name = "applyCycles"
type = "uint"
size = 4
default = 0

[[fields.DataTransformTlm]]
name = "masksApplied"
type = "uint"
size = 4
default = 0
doc = "Successful mask applications."

[[fields.DataTransformTlm]]
name = "resolveFailures"
type = "uint"
size = 4
default = 0
doc = "Target resolution failures."

[[fields.DataTransformTlm]]
name = "applyFailures"
type = "uint"
size = 4
default = 0
doc = "Mask application failures."

[[fields.DataTransformTlm]]
name = "entriesArmed"
type = "uint"
size = 4
default = 0
doc = "Currently armed entry count."

[[fields.TransformStats]]
name = "applyCycles"
type = "uint"
size = 4
default = 0

[[fields.TransformStats]]
name = "masksApplied"
type = "uint"
size = 4
default = 0
doc = "Successful mask applications."

[[fields.TransformStats]]
name = "resolveFailures"
