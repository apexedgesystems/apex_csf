# Scheduler (componentId=1, instanceIndex=0)
# Total: 183 bytes = 3 byte header + 12 x 15 byte task entries
#
# Single pool for native testing. For Thor deployment, split into:
#   Pool 0 (RT CPU): telemetry tasks
#   Pool 1 (GPU dispatch): kick/poll tasks

[SchedulerTprmHeader]
numPools = { type = "uint", size = 1, value = 1 }
workersPerPool = { type = "uint", size = 1, value = 2 }
numTasks = { type = "uint", size = 1, value = 12 }

