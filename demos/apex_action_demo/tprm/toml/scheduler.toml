# Scheduler (componentId=1, instanceIndex=0)
# Total: 3 + (15 x 5) = 78 bytes
#
# Task schedule for ApexActionDemo:
#   10 Hz: SensorModel sensorStep (priority 127)
#   10 Hz: DataTransform hold (priority 100, below the sensor's step: the
#          pool's one worker runs the step first and the hold after it in
#          the same cycle, so an applied mask outlives the step's rewrite
#          and the action phase evaluates the masked value; a schedule
#          with more workers must sequence the two, priority alone does
#          not order them)
#    1 Hz: SensorModel telemetry (priority -128, offset 5)
#    1 Hz: DataTransform telemetry (priority -128, offset 6)
#    1 Hz: SystemMonitor telemetry (priority -128, offset 7)
#
# Mask application itself is command-driven via the action engine's
# sequencer; the hold task only re-applies what a command applied while
# the entry stays armed.
#
# Component fullUids:
#   0xD200 (53760): SensorModel instance 0
#   0xCA00 (51712): DataTransform instance 0
#   0xC800 (51200): SystemMonitor instance 0

