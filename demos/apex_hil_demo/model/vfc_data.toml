# vfc_data.toml - Component data manifest for VirtualFlightCtrl
#
# Software model that emulates the STM32 flight controller for SIL testing.
# Shares the model/ directory with HilPlantModel.

component = "VirtualFlightCtrl"
namespace = "appsim::model"

[structs]
# Runtime state (registered with ApexRegistry)
VfcState = { category = "STATE" }

[[fields.VfcState]]
name = "rxCount"
type = "uint"
size = 4
doc = "Valid VehicleState frames received."

[[fields.VfcState]]
name = "txCount"
type = "uint"
size = 4
doc = "ControlCmd frames sent."

[[fields.VfcState]]
name = "crcErrors"
type = "uint"
size = 4
doc = "CRC validation failures."

[[fields.VfcState]]
name = "pollCount"
type = "uint"
size = 4
doc = "Transport poll iterations."
