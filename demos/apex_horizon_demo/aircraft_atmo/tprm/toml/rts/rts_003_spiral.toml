delayCycles      = { type = "uint", size = 4, value = 0 }
timeoutCycles    = { type = "uint", size = 4, value = 100 }
onTimeout        = { type = "uint", size = 1, value = "SKIP" }
onComplete       = { type = "uint", size = 1, value = "NEXT" }
gotoStep         = { type = "uint", size = 1, value = 0 }
retryMax         = { type = "uint", size = 1, value = 0 }

[StandaloneSequenceTprm.step_1.waitCondition]
targetFullUid    = { type = "uint", size = 4, value = 0 }
targetCategory   = { type = "uint", size = 1, value = 0 }
targetByteOffset = { type = "uint", size = 2, value = 0 }
targetByteLen    = { type = "uint", size = 1, value = 0 }
predicate        = { type = "uint", size = 1, value = 0 }
dataType         = { type = "uint", size = 1, value = 0 }
threshold        = { type = "array", size = 8, value = [0,0,0,0,0,0,0,0] }
enabled          = { type = "uint", size = 1, value = 0 }
reserved         = { type = "uint", size = 1, value = 0 }

[StandaloneSequenceTprm.step_1_tail]
reserved         = { type = "uint", size = 1, value = 0 }

# ------------------------------------------------------------------------------
