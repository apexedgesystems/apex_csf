targetCategory   = { type = "uint", size = 1, value = 0 }
targetByteOffset = { type = "uint", size = 2, value = 0 }
targetByteLen    = { type = "uint", size = 1, value = 0 }
predicate        = { type = "uint", size = 1, value = 0 }
dataType         = { type = "uint", size = 1, value = 0 }
threshold        = { type = "array", size = 8, value = [0,0,0,0,0,0,0,0] }
enabled          = { type = "uint", size = 1, value = 0 }
