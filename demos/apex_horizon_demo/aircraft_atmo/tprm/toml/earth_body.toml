# Earth CelestialBody (0xDC00): J2 gravity, ELLIPSOID terrain (no tile
# -- the aircraft demo's world contract is the atmosphere), LAYERED
# USSA76 atmosphere from the bound world bundle. The binding names the
# shared earth world by uid and pins its content hash: the bundle the
# bank carries must hash to exactly this value or init refuses. Update
# the pin from world_pack --verify output when world content changes.
[CelestialBodyTunables]
body                = { type = "uint", size = 1, value = 0 }    # EARTH
gravity_fidelity    = { type = "uint", size = 1, value = 1 }    # J2
terrain_fidelity    = { type = "uint", size = 1, value = 2 }    # ELLIPSOID
atmosphere_fidelity = { type = "uint", size = 1, value = 2 }    # LAYERED
world_uid           = { type = "uint", size = 4, value = "0x010100" }
world_pin           = { type = "uint", size = 8, value = "0xcde624259349dfc9" }
