# Earth CelestialBody (0xDC00): J2 gravity, ELLIPSOID terrain (no tile
# — the aircraft demo's world contract is the atmosphere), LAYERED
# USSA76 atmosphere. The table is the repo's tracked public-domain
# copy pending the generated-artifact swap (see docs/HOW_TO_RUN.md).
[CelestialBodyTunables]
body                = { type = "uint",   size = 1,   value = 0 }    # EARTH
gravity_fidelity    = { type = "uint",   size = 1,   value = 1 }    # J2
terrain_fidelity    = { type = "uint",   size = 1,   value = 2 }    # ELLIPSOID
atmosphere_fidelity = { type = "uint",   size = 1,   value = 2 }    # LAYERED
gravity_data_path   = { type = "string", size = 256, value = "" }
terrain_data_path   = { type = "string", size = 256, value = "" }
atmosphere_data_path= { type = "string", size = 256, value = "demos/apex_horizon_demo/rover_terrain/data/usa76.atm" }
