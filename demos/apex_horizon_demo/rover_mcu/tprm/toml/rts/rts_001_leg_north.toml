# RTS 001: leg north 5 ft, arrive, halt
#
# Straight leg. Waits on ARRIVED then returns to HOLD.
#
# Delays are scheduler cycles at 100 Hz. Commands are the ROVR/2 surface on
# the rover (0x00DE00): SET_MODE 0x0103, SET_TARGET_REL 0x0104, SET_TARGET_ABS
# 0x0105, SET_LED 0x0106, SET_SEQ_STATE 0x0107; HALT 0x0100, RESUME 0x0101.
# A step with waitCondition holds after its delay until the controller's
# ARRIVED byte (0xE200 OUTPUT @18) reads 1, then fires.

[__enums__]
COMMAND = 0
SKIP = 1
NEXT = 0
OUTPUT = 4
EQ = 4
UINT8 = 0

[StandaloneSequenceTprm]
sequenceId   = { type = "uint", size = 2, value = 1 }
eventId      = { type = "uint", size = 2, value = 1 }
stepCount    = { type = "uint", size = 1, value = 5 }
repeatCount  = { type = "uint", size = 1, value = 0 }
type         = { type = "uint", size = 1, value = 0 }
armed        = { type = "uint", size = 1, value = 1 }

