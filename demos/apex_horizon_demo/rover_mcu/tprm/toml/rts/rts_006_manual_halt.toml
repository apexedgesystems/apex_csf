# RTS 006: manual halt (panic)
#
# Plant-level HALT with both lamps red at 5 Hz; state 0x15 MANUAL_HALT.
#
# Delays are scheduler cycles at 100 Hz. Commands are the ROVR/2 surface on
# the rover (0x00DE00), through the sequence-owned drive opcodes SET_MODE_SEQ
# 0x0113 and SET_TARGET_REL_SEQ 0x0114 (the wire's 0x0103/0x0104 answer BUSY while
# a sequence runs); SET_LED 0x0106, SET_SEQ_STATE 0x0107; HALT 0x0100, RESUME 0x0101.
# A step with waitCondition holds after its delay until the controller's
# ARRIVED byte (0xE200 OUTPUT @18) reads 1, then fires.

[__enums__]
COMMAND = 0
SKIP = 1
NEXT = 0
OUTPUT = 4
EQ = 4
UINT8 = 0

[StandaloneSequenceTprm]
sequenceId   = { type = "uint", size = 2, value = 6 }
eventId      = { type = "uint", size = 2, value = 6 }
stepCount    = { type = "uint", size = 1, value = 4 }
repeatCount  = { type = "uint", size = 1, value = 0 }
type         = { type = "uint", size = 1, value = 0 }
armed        = { type = "uint", size = 1, value = 1 }

