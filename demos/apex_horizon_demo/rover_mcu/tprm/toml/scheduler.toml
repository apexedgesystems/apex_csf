# Scheduler (0x000100) for rover_mcu: 100 Hz fundamental. The board link
# (20 Hz, priority 70) reads the board's reply and sends the rover's state,
# then the controller (20 Hz, 60) takes the board's command (or runs the
# host law), then the plant (100 Hz, 50), then the lidar model (10 Hz, 45,
# the tick after the plant sweeps), then the bridge (100 Hz, 40);
# 1 Hz telemetry lines are staggered.

[SchedulerTprmHeader]
numPools = { type = "uint", size = 1, value = 1 }
workersPerPool = { type = "uint", size = 1, value = 1 }
numTasks = { type = "uint", size = 1, value = 11 }

