# ActionComponent (0x000500) for rover_mcu. Sequences are STANDALONE RTS
# files (tprm/toml/rts/, catalog-scanned at boot, started by id via 0x0510);
# the embedded sequence/notification tables stay disarmed. Watchpoints on
# the rover's OUTPUT (0x00DE00) arm the safety boundary: lidar obstacle,
# a +/-200 m geofence about the anchor, and terrain slope, each routed to
# a reason-stamped halt sequence. minFireCount 0 = fire on the predicate's
# rising edge only; a nonzero count fires on EVERY evaluation once that
# many edges have been seen, which for a sustained breach is every tick.

[__enums__]
# WatchPredicate
GT = 0
LT = 1
GE = 2
LE = 3
EQ = 4
NE = 5
BIT_SET = 6
BIT_CLEAR = 7
CHANGED = 8
# WatchDataType
UINT8 = 0
UINT16 = 1
UINT32 = 2
UINT64 = 3
INT8 = 4
INT16 = 5
INT32 = 6
INT64 = 7
FLOAT32 = 8
FLOAT64 = 9
# DataCategory
STATIC_PARAM = 0
TUNABLE_PARAM = 1
STATE = 2
INPUT = 3
OUTPUT = 4
# GroupLogic (AND=0 already defined above)
OR = 1
# ActionType
COMMAND = 0
ARM_CONTROL = 1
# ActionTrigger (IMMEDIATE=0 conflicts with nothing)
IMMEDIATE = 0
AT_CYCLE = 1
AFTER_CYCLES = 2
AT_TIME = 3
ON_EVENT = 4
# SequenceType
RTS = 0
ATS = 1
# LogSeverity
INFO = 0
WARNING = 1
ERR = 2


# ==============================================================================
# Watchpoints (8 x 26 bytes = 208 bytes)
# ==============================================================================

