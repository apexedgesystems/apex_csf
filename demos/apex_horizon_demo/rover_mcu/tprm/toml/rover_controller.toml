# RoverController (0xE200): boots HOLD at the anchor. WAYPOINT is pure
# pursuit along the leg line (aim point 2.5 m ahead of the rover's
# projection onto the line from the leg's start to its target, running
# past the target so the approach is straight) on the plant's steering
# geometry (wheelbase 1.5 m, 33 deg lock -> minimum radius ~2.3 m) with a
# trapezoidal speed profile: cruise 3 m/s (0.375 of 8), sqrt(2 a d)
# ramp-down against 2 m/s^2 braking, 0.6 m/s through corners, arrive
# inside 0.2 m or once past the leg's end within 0.5 m of the line. The
# heading rate is bounded at 15 deg/s by limiting the lock with speed. TRAJECTORY is a 5 deg
# constant steer at 0.6 throttle (a 17 m circle).
[RoverControllerTunables]
boot_mode                 = { type = "uint",  size = 1, value = 0 }
reserved0                 = { type = "array", size = 7, value = [0,0,0,0,0,0,0] }
anchor_lat_deg            = { type = "float", size = 8, value = 39.50 }
anchor_lon_deg            = { type = "float", size = 8, value = -105.50 }
trajectory_throttle_frac  = { type = "float", size = 8, value = 0.6 }
trajectory_steer_deg      = { type = "float", size = 8, value = 5.0 }
wheelbase_m               = { type = "float", size = 8, value = 1.5 }
max_steer_deg             = { type = "float", size = 8, value = 33.0 }
lookahead_m               = { type = "float", size = 8, value = 2.5 }
cruise_throttle_frac      = { type = "float", size = 8, value = 0.375 }
brake_m_s2                = { type = "float", size = 8, value = 2.0 }
corner_speed_frac         = { type = "float", size = 8, value = 0.2 }
corner_deg                = { type = "float", size = 8, value = 15.0 }
arrival_tolerance_m       = { type = "float", size = 8, value = 0.2 }
passed_end_cross_m        = { type = "float", size = 8, value = 0.5 }
max_yaw_rate_deg_s        = { type = "float", size = 8, value = 15.0 }
