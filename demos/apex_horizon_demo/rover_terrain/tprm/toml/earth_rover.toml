# GroundVehicle (0xDE00). Init pose sits at the center of the 39-40N,
# 106-105W terrain patch; 45-degree heading crosses it diagonally, and the
# 6 deg/s steering rate turns a slow circle over the tile.
#
# GroundVehicleTunables layout (offsets for hand-checking the packed bin):
#   double  mass_kg                 8 B  (offset   0)
#   double  max_speed_m_s           8 B  (offset   8)
#   double  throttle_default        8 B  (offset  16)
#   double  steer_rate_deg_s        8 B  (offset  24)
[GroundVehicleTunables]
mass_kg            = { type = "float",  size = 8,  value = 1500.0 }
max_speed_m_s      = { type = "float",  size = 8,  value = 8.0 }
throttle_default   = { type = "float",  size = 8,  value = 0.6 }
steer_rate_deg_s   = { type = "float",  size = 8,  value = 6.0 }
init_lat_deg       = { type = "float",  size = 8,  value = 39.50 }
init_lon_deg       = { type = "float",  size = 8,  value = -105.50 }
init_heading_deg   = { type = "float",  size = 8,  value = 45.0 }
max_slope_deg      = { type = "float",  size = 8,  value = 25.0 }
lidar_n_rays       = { type = "uint",   size = 4,  value = 8 }
lidar_reserved     = { type = "uint",   size = 4,  value = 0 }
lidar_max_range_m  = { type = "float",  size = 8,  value = 500.0 }
lidar_fov_deg      = { type = "float",  size = 8,  value = 90.0 }
lidar_step_m       = { type = "float",  size = 8,  value = 5.0 }
body_label         = { type = "string", size = 16, value = "earth_rover" }
