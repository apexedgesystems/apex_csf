lon_deg                 = { type = "array",  size = 64, element_type = "float", value = [-105.90, -105.50, -105.10, -105.30, -105.70, 0.0, 0.0, 0.0] }
atmosphere_alt_m        = { type = "float",  size = 8,  value = 30000.0 }
