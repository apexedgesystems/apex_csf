# app_data.toml - ApexSpecDemo application descriptor for Zenith target generation
#
# Pure SIL demo: a single spec-born environment sensor. The sensor's
# structs, commands, and telemetry all derive from sensor/apex_data.toml,
# so the Zenith target sees exactly the surface the component dispatches.
#
# Core components (Executive, Scheduler, FileSystem, Registry, Interface,
# Action) are auto-included by the target generator at their standard UIDs.
# Only declare app-specific component instances below.

application = "ApexSpecDemo"
description = "Spec-born sensor demo proving the spec-driven codegen chain."

[protocol]
transport = "TCP"
framing = "SLIP"
port = 9000

[[components]]
name = "SpecSensor"
fullUid = "0x00D400"
instanceIndex = 0
type = "SW_MODEL"
notes = "Spec-born drift sensor (50 Hz step, IDLE/MEASURE/FAULT_INJECT)"

[[components]]
name = "SpecActuator"
fullUid = "0x00D500"
instanceIndex = 0
type = "SW_MODEL"
notes = "Proto-authored slewing actuator (50 Hz step, rate-limited)"

[[components]]
name = "SpecBusDriver"
fullUid = "0x00D600"
instanceIndex = 0
type = "DRIVER"
notes = "Loopback bus driver (50 Hz drain)"

[[components]]
name = "SpecMatrix"
fullUid = "0x00D700"
type = "SUPPORT"
notes = "Full type-vocabulary checksum component"

[[components]]
name = "SpecLimits"
fullUid = "0x00D800"
instanceIndex = 0
type = "SW_MODEL"
notes = "Constraint-torture model (every rail kind)"

[[components]]
name = "SpecProtoMax"
fullUid = "0x00D900"
instanceIndex = 0
type = "SW_MODEL"
notes = "Maximal proto-profile reference"

[[components]]
name = "SpecChannel"
fullUid = "0x00DA00"
instanceIndex = 0
type = "SW_MODEL"
notes = "Ramp channel A (multi-instance pair)"

[[components]]
name = "SpecChannel"
fullUid = "0x00DA01"
instanceIndex = 1
type = "SW_MODEL"
notes = "Ramp channel B (multi-instance pair)"

[[components]]
name = "SystemMonitor"
fullUid = "0x00C800"
type = "SUPPORT"
