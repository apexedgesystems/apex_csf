[project]
name = "apex-ops"
version = "0.0.1"
description = "Apex operations tools: the APROTO client and protocol, ground-target generation and validation, the command and telemetry deck"
authors = [
    {name = "Kevin Alexander Gomez"}
]
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ops-deck = "apex_ops.deck_gen:main"
zenith-target = "apex_ops.target_gen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_ops"]

# The gate installs the package non-editable, so a sync has to rebuild it
# when its sources change, not only when this file does (uv's default).
# Cache keys only. The workspace root (tools/pyproject.toml) owns dependency
# resolution and sets the cooldown for every member; uv reads no resolution
# setting from a member, so none is repeated here.
# nosemgrep: package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
