[project]
name = "apex-analysis"
version = "0.0.1"
description = "Apex analysis tools: Monte Carlo result plotting"
authors = [
    {name = "Kevin Alexander Gomez"}
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.3,<4.0.0",
    "numpy>=2.2.4,<3.0.0",
    "matplotlib>=3.10.9,<4.0.0",
    "seaborn>=0.13.0,<0.14.0",
    "scipy>=1.11.0,<2.0.0",
]

[project.scripts]
mc-plot = "apex_analysis.mc_plot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_analysis"]

# The gate installs the package non-editable, so a sync has to rebuild it
# when its sources change, not only when this file does (uv's default).
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
