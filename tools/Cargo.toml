# The Rust tools: one workspace, one lock. Members live under <role>/rust/
# and are selected by role at build time (tools/CMakeLists.txt, mk/tools.mk).
[workspace]
resolver = "2"
members = ["build/rust/*", "ops/rust/*", "analysis/rust/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Kevin Alexander Gomez"]
license = "MIT"

[workspace.dependencies]
apex-tprm = { path = "build/rust/apex-tprm" }
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
nix = { version = "0.31", default-features = false, features = ["term", "fs", "poll", "time"] }
once_cell = "1.21.4"
rand = "0.10.1"
regex = "1.12.3"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11"
toml = "1.1"
toml_edit = "0.25"
walkdir = "2"
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"

[profile.dev]
debug = true
overflow-checks = true
opt-level = 0

[profile.release]
debug = false
overflow-checks = true
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
