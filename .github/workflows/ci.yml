# ==============================================================================
# CI -- lint, build, and test on PRs to main
#
# Change-scoped: a "changes" job classifies the PR diff, and the expensive jobs
# run only when their area changed. A Rust or Python workspace change (e.g. a
# Dependabot bump) does not rebuild the C++/CUDA surface; a docs-only change
# runs lint alone. Tools are scoped by role: a build-role change runs what the
# C++ build stands on (that role's Rust tests, the spec/.auto pin, the
# dictionary gate); an ops or analysis change runs that role's suites together
# (for ops: its Rust tests, the shell smoke and the Python suite, which holds
# the target-generation tests) and none of those. Scope-down is opt-in per
# known subtree: cross-cutting paths (.github/, mk/, docker/, the CMake build
# files) and any unrecognized path run the full suite, so a missed filter
# never silently drops coverage.
#
# Image strategy (see .github/actions/dev-setup): jobs pull the registry
# :latest image, which docker-images.yml keeps current with main. When the PR
# changes what an image is built from, the jobs that use that part rebuild it
# from the Dockerfiles instead, so tests run against the PR's intended image:
# every job for an image's own definition or for a change to how CI builds
# images (the setup action, the registry-cache overlay), and for a baked
# dependency only the jobs that build with it (the Python lock rebuilds for
# the Python tests alone; lint uses no bake). Lint has an image of its own
# (apex.lint: the format and secret-scan tools, no compiler toolchain), so
# its rebuild is that one stage.
#
# The build/test/smoke/docs chain runs in dev-cuda so the .cu surface is compile
# and link verified; docker-compose.ci.yml drops the GPU reservation so it
# starts on the GPU-less runner, and make testp excludes the cuda-labeled tests.
# ==============================================================================
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cpp: ${{ steps.f.outputs.cpp }}
      rust_build: ${{ steps.f.outputs.rust_build }}
      rust_roles: ${{ steps.f.outputs.rust_roles }}
      py: ${{ steps.f.outputs.py }}
      sh: ${{ steps.f.outputs.sh }}
      images: ${{ steps.f.outputs.images }}
      bakes_gate: ${{ steps.f.outputs.bakes_gate }}
      bakes_rust: ${{ steps.f.outputs.bakes_rust }}
      bakes_py: ${{ steps.f.outputs.bakes_py }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: f
        run: |
          # Diff against the PR base, or origin/main for a manual dispatch, so a
          # dispatch scopes (and rebuilds images) exactly as the PR would --
          # never a blanket image rebuild just because there is no PR context.
          base="${{ github.event.pull_request.base.ref || 'main' }}"
          # --no-renames: a rename lists both sides, so a file moving OUT of a
          # scoped area still classifies as a change to that area; default
          # rename detection would emit only the destination path.
          files=$(git diff --name-only --no-renames "origin/$base...HEAD")
          printf 'changed files:\n%s\n' "$files"
          # The decisions are ci-classify.py's (one rule table, checked by
          # make check-ci-classify): which jobs the paths select, which roles'
          # Rust tests, and which jobs rebuild their image. An empty diff (a
          # dispatch on main itself) selects every job and rebuilds nothing.
          # Its output is captured before it is written: a classifier that
          # fails stops this step with its status, where a pipeline into tee
          # would report tee's and leave every decision empty, which skips
          # the jobs that read them.
          decisions=$(printf '%s\n' "$files" | python3 tools/build/py/bin/ci-classify.py)
          printf '%s\n' "$decisions" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Lint and secret scan
    needs: changes
    runs-on: ubuntu-24.04
    # Runs in the lint image: pre-commit, the tools its hooks call and
    # gitleaks, with no compiler toolchain and no baked dependency. It is
    # rebuilt only when an image definition changed (`images`), and that
    # rebuild is of the lint stage alone, so a lock bump leaves the job on
    # the pulled image and a Dockerfile change costs it one small stage.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Host-side static check, no image needed -- run it before the image
      # pull so release-path drift is the fastest failure in the pipeline.
      - name: Check release paths (final.Dockerfile vs presets)
        run: make check-release-paths
      - name: Check platform consumers match the registry
        run: make check-platforms
      - name: Check the change classifier against its cases
        run: make check-ci-classify
      - name: Set up lint image
        uses: ./.github/actions/dev-setup
        with:
          registry: ${{ env.REGISTRY }}
          actor: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}
          service: lint
          rebuild: ${{ needs.changes.outputs.images }}
      - name: Format check
        run: docker compose run --rm -T lint make format-check
      - name: Secret scan (gitleaks)
        run: docker compose run --rm -T lint make gitleaks

  build-test:
    name: Build and test (CUDA)
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Overlay docker-compose.ci.yml for the host ccache bind. cuda-build has
      # no GPU reservation; make testp excludes the cuda-labeled tests on the
      # GPU-less runner.
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # This job builds the full debug tree in the CUDA image and needs disk
      # headroom; the host SDKs are unused inside the container, so reclaim first.
      - name: Reclaim disk
        uses: ./.github/actions/reclaim-disk
      - name: Set up cuda-build image
        uses: ./.github/actions/dev-setup
        with:
          registry: ${{ env.REGISTRY }}
          actor: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}
          service: cuda-build
          rebuild: ${{ needs.changes.outputs.images == 'true' || needs.changes.outputs.bakes_gate == 'true' }}
      # Second restore key: the nightly debug leg saves main-scoped entries,
      # the only ones a brand-new PR's first push can see (ccache is
      # content-addressed, so a partial-match cache only helps, never hurts).
      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ccache
          key: ccache-build-test-${{ github.sha }}
          restore-keys: |
            ccache-build-test-
            ccache-nightly-debug-
      - name: Prepare ccache dir
        run: mkdir -p .ccache
      - name: Build (debug, CUDA)
        run: docker compose run --rm -T cuda-build make debug
      - name: Run C++ tests
        run: docker compose run --rm -T cuda-build make testp
      - name: Demo smoke test (reuses debug build)
        run: docker compose run --rm -T cuda-build make smoke APP=apex_mc_demo
      # Hit rate of the persisted cache, in the job log where a regression
      # (key drift, broken bind) is visible -- a broken cache layer once ran
      # silent for five release runs.
      - name: ccache stats
        run: docker compose run --rm -T cuda-build ccache -s | tail -n 8

  rust:
    name: Rust tool tests
    needs: changes
    # One job for whichever roles' crates the change can break, so an ops or
    # analysis change tests its own crates and nothing of the build role.
    if: needs.changes.outputs.rust_roles != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROLES: ${{ needs.changes.outputs.rust_roles }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up build-base image
        uses: ./.github/actions/dev-setup
        with:
          registry: ${{ env.REGISTRY }}
          actor: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}
          service: build-base
          rebuild: ${{ needs.changes.outputs.images == 'true' || needs.changes.outputs.bakes_rust == 'true' }}
      - name: Run Rust tests
        run: docker compose run --rm -T build-base make test-rust ROLES="$ROLES"
      # Deny-all-warnings: the rust counterpart of clang-tidy's
      # warnings-as-errors. Deterministic -- clippy's version is pinned by the
      # image, so a finding here is a code change, never rule drift.
      - name: Rust static analysis (clippy)
        run: docker compose run --rm -T build-base make clippy ROLES="$ROLES"
      # Committed .auto headers must be byte-identical to what cdef_gen
      # emits from their specs -- a hand edit or a stale header after a
      # spec (or generator) change cannot merge. cdef_gen is a build-role
      # tool, and the specs and headers select that role.
      - name: Spec/.auto pin (check-cdef)
        if: needs.changes.outputs.rust_build == 'true'
        run: docker compose run --rm -T build-base make check-cdef

  data-db:
    name: Dictionaries generate
    needs: changes
    # The dictionary generator reads component manifests and .auto headers
    # (classified rust_build), the C++ headers and CMake registrations under
    # the component trees (cpp), and runs through the build role's Rust
    # generator (rust_build). Any of them can break a dictionary ground
    # tooling regenerates from, so the gate runs for either, on the smallest
    # image. The ops and analysis crates are not in its path.
    if: needs.changes.outputs.cpp == 'true' || needs.changes.outputs.rust_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up build-base image
        uses: ./.github/actions/dev-setup
        with:
          registry: ${{ env.REGISTRY }}
          actor: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}
          service: build-base
          rebuild: ${{ needs.changes.outputs.images == 'true' || needs.changes.outputs.bakes_gate == 'true' }}
      - name: Dictionaries generate (check-data-db)
        run: docker compose run --rm -T build-base make check-data-db
      # The gate stands on the helper's explicit-path error and its own
      # failure propagation; valid inputs alone would stay green if either
      # were removed, so the fixtures assert both verdicts here.
      - name: Helper and gate contracts
        run: docker compose run --rm -T build-base make check-data-manifest-helper check-data-db-contract check-build-info check-manifest-headers check-bundle-packaging

  py:
    name: Python tool tests
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up build-base image
        uses: ./.github/actions/dev-setup
        with:
          registry: ${{ env.REGISTRY }}
          actor: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}
          service: build-base
          rebuild: ${{ needs.changes.outputs.images == 'true' || needs.changes.outputs.bakes_py == 'true' }}
      - name: Run Python tests
        run: docker compose run --rm -T build-base make test-py

  # Host-side: the smoke needs only bash and tar, and runs in seconds.
  sh:
    name: Shell tool smoke
    needs: changes
    if: needs.changes.outputs.sh == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run shell tools smoke
        run: make test-sh

  sanitize:
    name: Sanitize
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up build-base image
        uses: ./.github/actions/dev-setup
        with:
          registry: ${{ env.REGISTRY }}
          actor: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}
          service: build-base
          rebuild: ${{ needs.changes.outputs.images == 'true' || needs.changes.outputs.bakes_gate == 'true' }}
      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ccache
          key: ccache-sanitize-${{ github.sha }}
          restore-keys: |
            ccache-sanitize-
            ccache-nightly-asan-ubsan-
      - name: Prepare ccache dir
        run: mkdir -p .ccache
      - name: Address + UB Sanitizer
        run: docker compose run --rm -T build-base make asan-ubsan
      - name: ccache stats
        run: docker compose run --rm -T build-base ccache -s | tail -n 8

  static-analysis:
    name: Static analysis
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The ci overlay drops dev-cuda's GPU device reservation -- the runner
      # has no GPU, and clang-tidy only parses the CUDA headers.
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # dev-cuda, not dev: the CUDA toolkit must be present so the CUDA-gated
      # translation units enter the compile database -- clang-tidy only parses
      # headers, no GPU needed. With the dev image, those TUs were invisible to
      # the gate and gated findings accumulated unseen.
      - name: Set up dev image
        uses: ./.github/actions/dev-setup
        with:
          registry: ${{ env.REGISTRY }}
          actor: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}
          service: dev-cuda
          rebuild: ${{ needs.changes.outputs.images == 'true' || needs.changes.outputs.bakes_gate == 'true' }}
      # No ccache here: clang-tidy does not compile through the launcher --
      # every cache this job ever saved was ~191 bytes (see CHECKS_CCACHE in
      # mk/checks.mk for the same rule on nightly legs).
      - name: clang-tidy (gated checks)
        run: docker compose run --rm -T dev-cuda make static
      # Doxygen ships in dev-base, which dev-cuda extends, so the docs
      # zero-warning gate stays in this job.
      - name: Build documentation (zero-warning gate)
        run: docker compose run --rm -T dev-cuda make docs-check

  # ----------------------------------------------------------------------------
  # Run report -- advisory timing/scope emit. Surfaces what the run did (scoped
  # vs full suite, image rebuild vs pull) and what each job cost, as notices +
  # the step summary, so a run explains itself without log archaeology.
  # Emit-only: never gates (always() + no failure paths).
  # ----------------------------------------------------------------------------
  report:
    name: Run report
    needs: [changes, lint, build-test, rust, data-db, py, sanitize, static-analysis]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Emit timing and scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CPP: ${{ needs.changes.outputs.cpp }}
          RUST: ${{ needs.changes.outputs.rust_roles }}
          PY: ${{ needs.changes.outputs.py }}
          IMAGES: ${{ needs.changes.outputs.images }}
          BAKES_GATE: ${{ needs.changes.outputs.bakes_gate }}
          BAKES_RUST: ${{ needs.changes.outputs.bakes_rust }}
          BAKES_PY: ${{ needs.changes.outputs.bakes_py }}
        run: |
          scope="scoped"
          [ "$CPP|$RUST|$PY" = "true|build ops analysis|true" ] && scope="full"
          baked=""
          [ "$BAKES_GATE" = "true" ] && baked="$baked the C++ jobs and the dictionary gate,"
          [ "$BAKES_RUST" = "true" ] && baked="$baked the Rust tests,"
          [ "$BAKES_PY" = "true" ] && baked="$baked the Python tests,"
          images="pulled"
          [ -n "$baked" ] && images="rebuilt for their baked dependencies by${baked%,}; pulled by the rest"
          [ "$IMAGES" = "true" ] && images="rebuilt (an image definition changed)"
          echo "::notice title=CI scope::suite=$scope (cpp=$CPP rust=[$RUST] py=$PY); images $images"
          {
            echo "## CI run report"
            echo ""
            echo "- **Suite**: $scope (cpp=$CPP, rust=[$RUST], py=$PY)"
            echo "- **Images**: $images"
            echo ""
            echo "| Job | Result | Duration |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name != "Run report") | [.name, (.conclusion // .status), .started_at, (.completed_at // "")] | @tsv' |
          while IFS=$'\t' read -r name concl start end; do
            secs=0
            if [ -n "$start" ] && [ -n "$end" ]; then
              secs=$(( $(date -d "$end" +%s) - $(date -d "$start" +%s) ))
            fi
            printf '| %s | %s | %dm%02ds |\n' "$name" "$concl" $((secs/60)) $((secs%60)) >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=CI timing::${name}: ${concl} in $((secs/60))m$((secs%60))s"
          done
